# Deploys the class-space API (server/) to Cloudflare Workers + D1.
# One-time setup (see server/README.md): repository secrets
#   CLOUDFLARE_API_TOKEN  (token with "Workers Scripts:Edit" and "D1:Edit")
#   CLOUDFLARE_ACCOUNT_ID
# and the D1 database id in server/wrangler.toml. Without the secrets the job is skipped.
name: Pubblica il server della classe

on:
  push:
    branches: [main, claude/focused-keller-mvg9h3]
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: Controlla la configurazione
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || grep -q REPLACE_WITH_D1_ID wrangler.toml; then
            echo "Cloudflare non ancora configurato: salto il deploy (vedi server/README.md)."
            echo "pronto=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.pronto == 'true'
        with:
          node-version: 22
      - name: Installa
        if: steps.cfg.outputs.pronto == 'true'
        run: npm ci || npm i
      - name: Test
        if: steps.cfg.outputs.pronto == 'true'
        run: npm test
      - name: Migrazioni del database
        if: steps.cfg.outputs.pronto == 'true'
        run: npx wrangler d1 migrations apply didattica-classe --remote
      - name: Deploy
        if: steps.cfg.outputs.pronto == 'true'
        run: npx wrangler deploy
