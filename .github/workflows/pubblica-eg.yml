# Publishes E.G. (Esercizi e Giochi) on GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Pubblica E.G. su GitHub Pages

on:
  push:
    branches: [main, claude/focused-keller-mvg9h3]
    paths:
      - "programmi/eg/**"
      - "programmi/giochi/**"
      - "dati/eg/**"
      - "dati/gorillas/**"
      - "js/**"
      - "css/**"
      - ".github/workflows/pubblica-eg.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepara il sito (solo E.G. e i giochi-premio)
        run: |
          mkdir -p _site/programmi _site/dati
          cp -r css js _site/
          cp -r programmi/eg programmi/giochi _site/programmi/
          cp -r dati/eg dati/gorillas _site/dati/
          touch _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="it">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>E.G. – Esercizi e Giochi – Prof. Carmelo Muscolino</title>
          <meta http-equiv="refresh" content="0; url=programmi/eg/index.html">
          </head>
          <body>
          <p><a href="programmi/eg/index.html">E.G. – Esercizi e Giochi</a> del Prof. Carmelo Muscolino</p>
          </body>
          </html>
          EOF
          find _site -type f | wc -l
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
